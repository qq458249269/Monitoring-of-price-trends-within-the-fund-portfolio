<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基金估值趋势监测</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">📈</span>
    <div>
      <h1>基金估值趋势监测</h1>
      <div class="sub">每分钟同步估值 · 红涨绿跌 · 多源负载均衡</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索基金代码 / 名称 / 拼音… (Ctrl+K)"
             autocomplete="off" spellcheck="false">
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <button id="syncBtn" class="btn" title="立即同步">⟳ 立即同步</button>
    <button id="reportBtn" class="btn" title="推送一次关注基金的预估当日涨跌">📊 收盘预估</button>
    <button id="updateBtn" class="btn" title="检查并应用更新">⬆ 更新</button>
    <div class="sync-status" id="syncStatus">–</div>
    <select id="sourceSelect" class="btn source-select" title="手动切换估值数据源">
      <option value="auto">数据源:自动</option>
      <option value="sina">新浪</option>
      <option value="tencent">腾讯</option>
    </select>
    <button id="themeBtn" class="btn" title="切换主题(暗/亮/跟随系统)">🌙</button>
  </div>
</header>

<div class="app-layout">
  <main>
    <section id="fundList" class="fund-list">
      <div class="loading">加载中…</div>
    </section>

    <section id="emptyState" class="empty hidden">
      <div class="empty-icon">🗂️</div>
      <p>还没有关注的基金,点击上方搜索添加。</p>
    </section>
  </main>

  <aside class="event-panel" aria-label="通知">
    <div class="event-head">
      <strong>通知 <span id="eventCount">0</span></strong>
      <button id="eventLatest" class="mini-btn hidden" type="button">查看新通知</button>
      <button id="eventClear" class="mini-btn" type="button">清空</button>
    </div>
    <div id="eventFeed" class="event-feed" tabindex="0" aria-label="通知列表">
      <div id="eventEmpty" class="event-empty">暂无通知</div>
    </div>
  </aside>
</div>

<!-- 概要抽屉 -->
<div id="drawerMask" class="drawer-mask hidden"></div>
<aside id="drawer" class="drawer hidden" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <div id="dTitle" class="d-title">—</div>
      <div id="dSub" class="d-sub">—</div>
    </div>
    <button id="dClose" class="btn icon-btn" title="关闭">✕</button>
  </div>
  <div id="dBody" class="drawer-body">
    <div class="loading">加载概要…</div>
  </div>
</aside>

<div id="toast" class="toast hidden"></div>

<!-- 卡片右键菜单 -->
<div id="ctxMenu" class="ctx-menu hidden" role="menu">
  <div class="ctx-item" data-act="detail">📄 概要</div>
  <div class="ctx-item" data-act="rename">✏️ 改名</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" data-act="remove">🗑 取关</div>
</div>

<footer class="foot">
  <span id="srcStats" class="src-stats"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>
